# home-projects on Coolify.
#
# Deploy this as ONE "Docker Compose" resource, not as separate applications:
# the frontend's nginx reaches the backend by its service name, and because
# everything sits behind one domain the app calls relative paths — so there is
# no API address to bake into the build.
#
# ---------------------------------------------------------------------------
# Set these in Coolify under Environment Variables. Every one is required.
#
# They are written as plain ${VAR} on purpose. Compose's own guard, ${VAR:?…},
# does not work here: Coolify reads the compose file to offer you the variables
# it finds, and takes everything after the ? as a default value — so a missing
# password would quietly become the sentence explaining that it is missing.
# Left plain, an empty one is reported by whoever needs it: postgres says it
# will not initialise without a password, and the backend names the variable it
# is missing and stops.
#
#   POSTGRES_PASSWORD    anything long and random
#   JWT_SECRET           anything long and random — signs the access tokens
#   SECRET_KEY           anything long and random — encrypts the credentials in
#                        the accounts menu. Changing it later makes every stored
#                        password unreadable.
#   PUBLIC_URL           the address this server is reached at. With a domain,
#                        https://<that domain>; without one, something like
#                        http://192.168.178.54:8091. Clone addresses, calendar
#                        subscription links and webhook URLs are built from it.
#   COOKIE_SECURE        false while that address is plain http, or the browser
#                        will not send the session cookies back.
#   OWNER_USERNAME       only used on the very first start …
#   OWNER_PASSWORD       … when no user exists yet. At least 10 characters.
#
# Then:
#   1. Set the domain on the **frontend** service. Nothing else gets one — the
#      backend and the database are only reachable inside the stack.
#   2. Under Storages, point the two directory mounts at real host paths. In the
#      image they would be gone after every deploy, and the repositories and the
#      project files with them.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeprojects}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-homeprojects}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # The very first start initialises the database. That is not a failure.
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      TZ: ${TZ:-Europe/Berlin}
      ADDR: ":5000"
      DATABASE_URL: postgres://${POSTGRES_USER:-homeprojects}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-homeprojects}?sslmode=disable
      DATA_DIR: /srv/data
      GIT_DIR: /srv/git

      # The address this server is reachable at from outside: the domain you set
      # on the frontend service, with https://.
      PUBLIC_URL: ${PUBLIC_URL}

      JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY: ${SECRET_KEY}

      # Behind Coolify's proxy this is HTTPS, so the cookies say so.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

      # Only used on the very first start, when no user exists yet.
      OWNER_USERNAME: ${OWNER_USERNAME}
      OWNER_PASSWORD: ${OWNER_PASSWORD}

      ALLOW_PROJECT_COMMANDS: ${ALLOW_PROJECT_COMMANDS:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}

      # Git over SSH: `git clone git@your-host:<group>.git`. Off until these are
      # set — run scripts/setup-git-ssh.sh on the host, it prints them.
      GIT_SSH_HOST: ${GIT_SSH_HOST:-}
      GIT_SSH_SECRET: ${GIT_SSH_SECRET:-}
      GIT_SSH_WRAPPER: ${GIT_SSH_WRAPPER:-/usr/local/bin/hp-git-shell}
    volumes:
      # These two must be directories on the host, not volumes inside the
      # image — otherwise every deploy takes the repositories and the project
      # files with it. In Coolify they show up under "Storages".
      - ${GIT_DIR:-/srv/home-projects/git}:/srv/git
      - ${DATA_DIR:-/srv/home-projects/data}:/srv/data
    # Only git over SSH needs this: sshd and the wrapper run on the host and
    # have to reach the backend. Local only — nothing outside the machine gets
    # in this way. Set BACKEND_PORT if 5000 is already taken on the host.
    ports:
      - "${BACKEND_PORT:-127.0.0.1:5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    # With a domain on this service, Coolify's proxy reaches it over the stack's
    # own network and this port is not needed. Without one — while the server
    # only answers on the home network — it is the way in. The default binds to
    # localhost only; set FRONTEND_PORT=0.0.0.0:8091 to open it to the network
    # on purpose, and PUBLIC_URL to the address that then reaches it.
    ports:
      - "${FRONTEND_PORT:-127.0.0.1:8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
