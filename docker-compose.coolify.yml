# home-projects on Coolify.
#
# Deploy this as ONE "Docker Compose" resource, not as separate applications:
# the frontend's nginx reaches the backend by its service name, and because
# everything sits behind one domain the app calls relative paths — so there is
# no API address to bake into the build.
#
# In Coolify:
#   1. New resource → Docker Compose → this repository, compose file
#      `docker-compose.coolify.yml`.
#   2. Set the domain on the **frontend** service. Nothing else gets one:
#      the backend and the database are only reachable inside the stack.
#   3. Fill in the environment variables below (Coolify generates the ones
#      written as `$SERVICE_PASSWORD_*` / `$SERVICE_BASE64_*` itself).
#   4. Set the two host paths for the storage — see the note at `volumes`.
#
# No ports are published here on purpose. Coolify's proxy talks to the
# containers over its own network; a published port would only be a second,
# unprotected way in.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeprojects}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-homeprojects}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-homeprojects}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      TZ: ${TZ:-Europe/Berlin}
      ADDR: ":5000"
      DATABASE_URL: postgres://${POSTGRES_USER:-homeprojects}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-homeprojects}?sslmode=disable
      DATA_DIR: /srv/data
      GIT_DIR: /srv/git

      # The address the server is reachable at from outside. Clone URLs,
      # calendar subscription links and webhook addresses are built from it, so
      # it has to be the real domain — Coolify fills it in from the domain you
      # set on the frontend service.
      PUBLIC_URL: ${SERVICE_URL_FRONTEND}

      # Signs the access tokens. Coolify generates it once and keeps it.
      JWT_SECRET: ${SERVICE_BASE64_64_JWT}
      # Encrypts the credentials in the accounts menu. Changing it makes every
      # stored password unreadable — they then have to be entered again.
      SECRET_KEY: ${SERVICE_BASE64_64_SECRET}

      # Behind Coolify's proxy this is HTTPS, so the cookies say so.
      COOKIE_SECURE: "true"

      # Only used on the very first start, when no user exists yet. Set them,
      # deploy once, sign in, then you may clear them again.
      OWNER_USERNAME: ${OWNER_USERNAME}
      OWNER_PASSWORD: ${OWNER_PASSWORD}

      ALLOW_PROJECT_COMMANDS: ${ALLOW_PROJECT_COMMANDS:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}

      # Git over SSH: `git clone git@your-host:<group>.git`. Off until these are
      # set — run scripts/setup-git-ssh.sh on the host, it prints them.
      GIT_SSH_HOST: ${GIT_SSH_HOST:-}
      GIT_SSH_SECRET: ${GIT_SSH_SECRET:-}
      GIT_SSH_WRAPPER: ${GIT_SSH_WRAPPER:-/usr/local/bin/hp-git-shell}
    volumes:
      # These two must be directories on the host, not volumes inside the
      # image — otherwise every deploy takes the repositories and the project
      # files with it. In Coolify they show up under "Storages" as directory
      # mounts once this file is parsed.
      - ${GIT_DIR:-/srv/home-projects/git}:/srv/git
      - ${DATA_DIR:-/srv/home-projects/data}:/srv/data
    # The wrapper that sshd runs lives on the host and has to reach this
    # container. Local only — nothing outside the machine gets in this way.
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # This is the one service with a domain. Set it in Coolify on this
      # service; the backend reads it back as PUBLIC_URL above.
      SERVICE_FQDN_FRONTEND: /
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
