# nginx in front of everything.
#
# Two details from the brief, both learned the hard way:
#   * the git routes need their own location with request buffering off, or a
#     large push breaks halfway through;
#   * index.html must not be cached, or you keep seeing the old bundle after a
#     deploy while every hashed asset is already new.

upstream backend {
    server backend:5000;
}

# A WebSocket asks to stop being HTTP. Without this the request arrives at the
# backend as an ordinary GET, the upgrade never happens, and a terminal behind
# this proxy can never connect — which is exactly what it did.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;

    # --- git over HTTP ------------------------------------------------------
    location /git/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Git-Protocol $http_git_protocol;
        # A push streams; buffering it would break large ones.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 0;
    }

    # --- the API and the published sites ------------------------------------
    location ~ ^/(api|s|oneway)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The terminal's socket and the event stream both live under /api.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        # A terminal sits open and quiet for as long as somebody has it open;
        # ten minutes was enough to cut it off mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://backend;
    }

    # --- the app ------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change; the entry point always may.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
}
